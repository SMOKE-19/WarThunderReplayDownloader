[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warthunder-replay-downloader"
version = "0.1.0"
description = "Download all replay parts for a War Thunder replay."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "browser-cookie3>=0.20,<0.21",
    "requests>=2.34,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
